# ==============================================================================
# Nginx Configuration for Multi-Tenant Laundry SaaS Platform
# Domain: laundryzone.dsrzone.com
# Supports: Central Portal, Wildcard Subdomains (*.laundryzone.dsrzone.com), and Custom Domains
# ==============================================================================

# 1. HTTP Redirect to HTTPS (All traffic)
server {
    listen 80;
    listen [::]:80;
    server_name laundryzone.dsrzone.com *.laundryzone.dsrzone.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/laundryzone/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Central SaaS Platform & Wildcard Tenant Subdomains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name laundryzone.dsrzone.com *.laundryzone.dsrzone.com;

    root /var/www/laundryzone/public;
    index index.php index.html;

    # SSL Certificates (Generated via Certbot wildcard)
    ssl_certificate /etc/letsencrypt/live/laundryzone.dsrzone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laundryzone.dsrzone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM FastCGI
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# 3. Custom Tenant Domains Block (e.g. clientdomain.com)
server {
    listen 80;
    listen 443 ssl http2;
    server_name ~^(?!.*laundryzone\.dsrzone\.com).+$;

    root /var/www/laundryzone/public;
    index index.php;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
